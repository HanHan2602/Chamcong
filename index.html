<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700&display=swap"><title>Chấm công - Thảo Điền Florist</title>
<style>
:root{--bg:#04241f;--bg2:#0a3029;--card:#0d3a32;--line:#1d5247;--gold:#e8b48a;--gold2:#f6dcc6;--tx:#f3ebe3;--mu:#9bb5ac;--bad:#e88a8a;--ok:#8ae8b0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
header img{height:64px;width:64px;object-fit:cover;border-radius:8px}
header h1{margin:0;font-size:22px;font-weight:600;line-height:1.6;padding:2px 0;letter-spacing:.02em;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;color:transparent}
header p{margin:0;color:var(--mu);font-size:13px}
.nav{display:flex;gap:8px;padding:12px 16px 0;max-width:1100px;margin:auto}
.nav button,.sub button,.seg button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;border-radius:10px;cursor:pointer;color:var(--mu)}
.nav button.on,.sub button.on,.seg button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1a0e;border-color:transparent;font-weight:700}
main{max-width:1100px;margin:auto;padding:12px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.clock{text-align:center;font-size:40px;font-weight:300;line-height:1.3;color:var(--gold);letter-spacing:.05em;margin:6px 0 0}
.date{text-align:center;color:var(--mu);margin-bottom:12px}
label{display:block;margin:12px 0 4px;color:var(--gold2);font-size:14px}
input,select,textarea{width:100%;padding:11px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.seg,.sub{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.sub button{flex:none;padding:8px 14px}
.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1a0e;font-weight:700;font-size:16px;cursor:pointer}
.sm{padding:5px 9px;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:8px;cursor:pointer;font-size:13px;margin:1px}
.sm.d{border-color:var(--bad);color:var(--bad)}
.pv{width:100px;height:100px;object-fit:cover;border-radius:10px;margin-top:8px;display:none}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--gold);font-weight:400}
td img{width:38px;height:38px;object-fit:cover;border-radius:6px;cursor:pointer}
.tag{padding:2px 8px;border-radius:99px;font-weight:700}.X{background:#1d6a4d}.P{background:#8a5a1d}.PX{background:#6a4d1d}.N{background:#5a2a2a}
.bad{color:var(--bad)}.ok{color:var(--ok)}.mu{color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:120px}
#m{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#m.on{display:flex}
.box{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:18px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.box h3{margin:0 0 8px;color:var(--gold);font-weight:400}.bt{display:flex;gap:8px;margin-top:14px}.bt button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer}.bt button.p{background:var(--gold);color:#2a1a0e;border:0;font-weight:700}
.box img.big{width:100%;border-radius:10px}
.hide{display:none}
</style></head><body>
<header><img id="lg" alt="logo"><div><h1 id="ti"></h1><p id="su"></p></div></header>
<div class="nav"><button class="on" data-p="p1">Chấm công</button><button data-p="p2">Quản lý</button></div>
<main>
<section id="p1">
 <div class="card"><div class="clock" id="ck"></div><div class="date" id="dt"></div>
  <div class="seg"><button class="on" data-c="ci">Check in</button><button data-c="co">Check out</button></div>
  <div id="ci">
   <label>Tên nhân viên</label><select id="ciN"></select>
   <label>Loại chấm công</label><select id="ciT"><option value="normal">Đi làm bình thường</option><option value="full">Nghỉ phép cả ngày</option><option value="am">Nghỉ phép sáng</option><option value="pm">Nghỉ phép chiều</option></select>
   <label>Ảnh check in</label><input type="file" id="ciF" accept="image/*" capture="user"><img class="pv" id="ciP">
   <button class="btn" onclick="checkin()">Check in</button></div>
  <div id="co" class="hide">
   <label>Tên nhân viên</label><select id="coN"></select>
   <label>Loại</label><select id="coT"><option value="home">Về</option><option value="half">Nghỉ buổi chiều</option></select>
   <label>Ảnh check out</label><input type="file" id="coF" accept="image/*" capture="user"><img class="pv" id="coP">
   <button class="btn" onclick="checkout()">Check out</button></div>
 </div>
</section>
<section id="p2" class="hide">
 <div id="lgn" class="card"><label>ID</label><input id="aid" autocomplete="username"><label>Mật khẩu</label><input id="apw" type="password" autocomplete="current-password"><button class="btn" onclick="login()">Đăng nhập</button></div>
 <div id="adm" class="hide">
  <div class="sub"><button class="on" data-a="a1">Chấm công</button><button data-a="a2">Nhân viên</button><button data-a="a3">Đăng nhập &amp; giao diện</button><button onclick="logout()">Thoát</button></div>
  <div id="a1"></div><div id="a2" class="hide"></div><div id="a3" class="hide"></div>
 </div>
</section>
</main>
<div id="m"></div>

const mark=r.type=='full'?'P':(r.type=='normal'&&r.ot!='half'?'X':'PX');
if(r.type=='normal'&&r.in>s.start)late=mi(r.in)-mi(s.start);
if(r.type=='normal'&&r.out&&r.ot=='home'&&r.out<s.end)early=mi(s.end)-mi(r.out);
if(mark=='X'){if(r.in&&mi(s.start)-mi(r.in)>=30)ot+=mi(s.start)-mi(r.in);if(r.out&&mi(r.out)-mi(s.end)>=30)ot+=mi(r.out)-mi(s.end)}
return{mark,late,early,ot}}
function range(){const m=$('rm')?.value||'day',d=new Date(($('rd')?.value||today())+'T00:00:00');let a=new Date(d),b=new Date(d);
if(m=='week'){const w=(d.getDay()+6)%7;a.setDate(d.getDate()-w);b=new Date(a);b.setDate(a.getDate()+6)}
if(m=='month'){a=new Date(d.getFullYear(),d.getMonth(),1);b=new Date(d.getFullYear(),d.getMonth()+1,0)}
return[fd(a),fd(b),m]}
function days(a,b){const o=[];for(let d=new Date(a+'T00:00:00');fd(d)<=b;d.setDate(d.getDate()+1))o.push(fd(d));return o}
function stats(a,b){const ds=days(a,b).filter(d=>d<=today()),open=new Set(db.rec.filter(r=>r.d>=a&&r.d<=b).map(r=>r.d));
return db.staff.filter(s=>!s.left||s.left>=a).map(s=>{const o={s,x:0,p:0,px:0,late:0,early:0,ot:0,otAp:0,miss:0,xd:[],pd:[]};
db.rec.filter(r=>r.sid==s.id&&r.d>=a&&r.d<=b).forEach(r=>{const c=calc(r);if(c.mark=='X'){o.x++;o.xd.push(r.d.slice(8))}else if(c.mark=='P'){o.p++;o.pd.push(r.d.slice(8))}else{o.px++;o.xd.push(r.d.slice(8)+'½');o.pd.push(r.d.slice(8)+'½')}
if(c.late)o.late++;if(c.early)o.early++;o.ot+=c.ot;if(r.ap)o.otAp+=c.ot});
ds.forEach(d=>{if(open.has(d)&&(!s.left||d<=s.left)&&!db.rec.find(r=>r.d==d&&r.sid==s.id))o.miss++});return o})}
function renderA1(){const[a,b,m]=range(),pr=$('rm')?{m:$('rm').value,d:$('rd').value}:{m:'day',d:today()};
let rows=db.rec.filter(r=>r.d>=a&&r.d<=b).sort((x,y)=>y.d.localeCompare(x.d)||x.in.localeCompare(y.in)).map(r=>({r}));
if(m=='day'&&a<=today())active(a).forEach(s=>{if(!db.rec.find(r=>r.d==a&&r.sid==s.id))rows.push({miss:s})});
const tr=rows.map(({r,miss})=>{if(miss)return`<tr><td>${esc(miss.name)}</td><td colspan="9"><span class="tag N">Chưa check in</span></td></tr>`;
const s=sf(r.sid)||{name:'(đã xóa)'},c=calc(r);
return`<tr><td>${m!='day'?dmy(r.d)+' – ':''}${esc(s.name)}</td><td>${r.in||''}</td><td>${r.out||''}</td><td><span class="tag ${c.mark}">${c.mark}</span></td>
<td>${c.ot?hm(c.ot)+(r.ap?' <span class="ok">✔</span>':` <button class="sm" onclick="appr(${r.id})">Duyệt</button>`):''}</td><td class="${c.late?'bad':''}">${c.late?c.late+'p':''}</td><td class="${c.early?'bad':''}">${c.early?c.early+'p':''}</td>
<td>${r.photo?`<img src="${r.photo}" onclick="big(${r.id},1)">`:''}${r.photo2?` <img src="${r.photo2}" onclick="big(${r.id},2)">`:''}</td><td>${esc(r.reason)}</td><td><button class="sm" onclick="editR(${r.id})">Sửa</button><button class="sm d" onclick="delR(${r.id})">Xóa</button></td></tr>`}).join('')||'<tr><td colspan="10" class="mu">Chưa có dữ liệu</td></tr>';
const st=stats(a,b),top=(f,fn)=>{const v=[...st].sort((x,y)=>fn(y)-fn(x))[0];return v&&fn(v)>0?`${esc(v.s.name)} (${f(v)})`:'—'};
const best=[...st].sort((x,y)=>(y.x+y.px/2-y.late*.5-y.miss)-(x.x+x.px/2-x.late*.5-x.miss))[0];
const left=db.staff.filter(s=>s.left&&s.left>=a&&s.left<=b).map(s=>esc(s.name)+' ('+dmy(s.left)+')').join(', ')||'—';
$('a1').innerHTML=`<div class="card"><div class="row"><div><label>Xem theo</label><select id="rm" onchange="renderA1()"><option value="day">Ngày</option><option value="week">Tuần</option><option value="month">Tháng</option></select></div><div><label>Ngày</label><input type="date" id="rd" onchange="renderA1()"></div><button class="sm" style="flex:none;padding:11px" onclick="xls()">⬇ Xuất Excel</button></div>
<p class="mu">${dmy(a)}${a!=b?' → '+dmy(b):''}</p></div>
<div class="card tw"><table><tr><th>Tên</th><th>Vào</th><th>Ra</th><th>Công</th><th>Tăng ca</th><th>Đi trễ</th><th>Về sớm</th><th>Ảnh vào/ra</th><th>Ghi chú</th><th></th></tr>${tr}</table>
<p class="mu">X: đi làm · P: phép · PX: nửa ngày · Tăng ca tính khi đến sớm/về muộn từ 30 phút, cộng dồn.</p></div>
<div class="card"><h3 style="margin-top:0;color:var(--gold);font-weight:400">Đánh giá</h3>
<p>🌟 Đầy đủ nhất: ${best&&(best.x+best.px)?esc(best.s.name):'—'}<br>⏰ Hay đi trễ nhất: ${top(v=>v.late+' lần',v=>v.late)}<br>🌙 Tăng ca nhiều nhất: ${top(v=>hm(v.ot),v=>v.ot)}<br>📝 Hay quên check in: ${top(v=>v.miss+' ngày',v=>v.miss)}<br>🚪 Đã nghỉ việc: ${left}</p>
<div class="tw"><table style="min-width:600px"><tr><th>Tên</th><th>Đi làm</th><th>Phép</th><th>Nửa ngày</th><th>Trễ</th><th>Tăng ca</th><th>Quên CI</th></tr>${st.map(v=>`<tr><td>${esc(v.s.name)}${v.s.left?' <span class="mu">(nghỉ)</span>':''}</td><td>${v.x}</td><td>${v.p}</td><td>${v.px}</td><td>${v.late}</td><td>${hm(v.ot)||'0'}${v.otAp?' (duyệt '+hm(v.otAp)+')':''}</td><td>${v.miss}</td></tr>`).join('')}</table></div></div>
<div class="card"><h3 style="margin-top:0;color:var(--gold);font-weight:600">Xóa dữ liệu chấm công</h3><div class="row"><div><label>Xóa theo</label><select id="dt_t" onchange="$('dt_m').classList.toggle('hide',this.value!='m');$('dt_y').classList.toggle('hide',this.value!='y')"><option value="m">Tháng</option><option value="y">Năm</option></select></div><div><label>Thời gian</label><input type="month" id="dt_m" value="${today().slice(0,7)}"><input type="number" id="dt_y" class="hide" value="${today().slice(0,4)}" min="2000" max="2100"></div><button class="sm d" style="flex:none;padding:11px" onclick="delData()">Xóa dữ liệu</button></div></div>`;
$('rm').value=pr.m;$('rd').value=pr.d}
async function delData(){const k=$('dt_t').value,v=k=='m'?$('dt_m').value:$('dt_y').value;if(!v)return info('Thiếu thông tin','Vui lòng chọn thời gian.');const lab=k=='m'?'tháng '+v.slice(5)+'/'+v.slice(0,4):'năm '+v,n=db.rec.filter(r=>r.d.startsWith(v)).length;if((await dlg('⚠ Xóa dữ liệu chấm công',`Sẽ xóa hết toàn bộ dữ liệu chấm công của ${lab} (${n} bản ghi). Bạn có đồng ý không?`,[['Không',0],['Đồng ý xóa',1,'p']])).v){const ids=db.rec.filter(r=>r.d.startsWith(v)).map(r=>r.id);db.rec=db.rec.filter(r=>!r.d.startsWith(v));delDocs('records',ids).catch(fail);renderA1();info('✔','Đã xóa dữ liệu chấm công của '+lab+'.')}}
function appr(id){const r=db.rec.find(r=>r.id==id);r.ap=true;putRec(r).catch(fail);renderA1()}
function big(id,n){const r=db.rec.find(x=>x.id==id);info(n==2?'Ảnh check out':'Ảnh check in',`<img class="big" src="${n==2?r.photo2:r.photo}">`)}
async function delR(id){if((await dlg('Xóa chấm công','Bạn chắc chắn muốn xóa?',[['Hủy',0],['Xóa',1,'p']])).v){db.rec=db.rec.filter(r=>r.id!=id);delDocs('records',[id]).catch(fail);renderA1()}}
async function editR(id){const r=db.rec.find(x=>x.id==id);const o=(v,l,c)=>`<option value="${v}" ${c==v?'selected':''}>${l}</option>`;
const x=await dlg('Chỉnh sửa chấm công',`<label>Loại</label><select name="type">${Object.entries(TY).map(([k,v])=>o(k,v,r.type)).join('')}</select><label>Giờ vào</label><input type="time" name="in" value="${r.in}"><label>Giờ ra</label><input type="time" name="out" value="${r.out}"><label>Loại check out</label><select name="ot">${o('home','Về',r.ot)}${o('half','Nghỉ buổi chiều',r.ot)}</select><label>Ghi chú</label><textarea name="reason" rows="2">${esc(r.reason)}</textarea>`,[['Hủy',0],['Lưu',1,'p']]);
if(x.v){Object.assign(r,x.f);putRec(r).catch(fail);renderA1()}}
function xls(){const[a,b]=range(),st=stats(a,b);let h=`<meta charset="utf-8"><h3>Tổng hợp công ${dmy(a)} - ${dmy(b)}</h3><table border="1"><tr><th>Tên</th><th>Ngày đi làm</th><th>Số ngày đi làm</th><th>Ngày nghỉ phép</th><th>Số ngày phép</th><th>Nửa ngày</th><th>Số lần đi trễ</th><th>Giờ tăng ca</th><th>Giờ tăng ca đã duyệt</th><th>Quên check in</th><th>Ngày nghỉ việc</th></tr>`;
st.forEach(v=>h+=`<tr><td>${esc(v.s.name)}</td><td>${v.xd.join(', ')}</td><td>${v.x}</td><td>${v.pd.join(', ')}</td><td>${v.p}</td><td>${v.px}</td><td>${v.late}</td><td>${(v.ot/60).toFixed(2)}</td><td>${(v.otAp/60).toFixed(2)}</td><td>${v.miss}</td><td>${v.s.left?dmy(v.s.left):''}</td></tr>`);
h+='</table><br><h3>Chi tiết</h3><table border="1"><tr><th>Ngày</th><th>Tên</th><th>Vào</th><th>Ra</th><th>Công</th><th>Tăng ca (phút)</th><th>Trễ (phút)</th><th>Về sớm (phút)</th><th>Ghi chú</th></tr>';
db.rec.filter(r=>r.d>=a&&r.d<=b).sort((x,y)=>x.d.localeCompare(y.d)).forEach(r=>{const c=calc(r);h+=`<tr><td>${dmy(r.d)}</td><td>${esc((sf(r.sid)||{}).name)}</td><td>${r.in}</td><td>${r.out}</td><td>${c.mark}</td><td>${c.ot}</td><td>${c.late}</td><td>${c.early}</td><td>${esc(r.reason)}</td></tr>`});
const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([h+'</table>'],{type:'application/vnd.ms-excel'}));l.download=`cong_${a}_${b}.xls`;l.click()}
function renderA2(){const f=s=>`<tr><td>${esc(s.name)}</td><td>${s.type=='main'?'Chính':'Phụ'}</td><td>${s.start}–${s.end}</td>${s.left?`<td>${dmy(s.left)}</td>`:''}<td>${s.left?`<button class="sm" onclick="back(${s.id})">Đi làm lại</button>`:`<button class="sm" onclick="editS(${s.id})">Sửa</button><button class="sm" onclick="quit(${s.id})">Nghỉ việc</button>`}<button class="sm d" onclick="delS(${s.id})">Xóa</button></td></tr>`;
const A=db.staff.filter(s=>!s.left),L=db.staff.filter(s=>s.left);
$('a2').innerHTML=`<div class="card"><button class="btn" style="margin:0 0 12px" onclick="editS()">+ Thêm nhân viên</button><div class="tw"><table style="min-width:480px"><tr><th>Tên</th><th>Loại</th><th>Giờ làm</th><th></th></tr>${A.map(f).join('')||'<tr><td class="mu">Chưa có nhân viên</td></tr>'}</table></div></div>
${L.length?`<div class="card"><h3 style="margin-top:0;color:var(--gold);font-weight:400">Đã nghỉ việc</h3><div class="tw"><table style="min-width:480px"><tr><th>Tên</th><th>Loại</th><th>Giờ làm</th><th>Ngày nghỉ</th><th></th></tr>${L.map(f).join('')}</table></div></div>`:''}`}
async function editS(id){const s=id?sf(id):{name:'',start:'08:00',end:'17:00',type:'main'};
const x=await dlg(id?'Sửa nhân viên':'Thêm nhân viên',`<label>Họ tên</label><input name="name" value="${esc(s.name)}"><label>Giờ bắt đầu</label><input type="time" name="start" value="${s.start}"><label>Giờ kết thúc</label><input type="time" name="end" value="${s.end}"><label>Loại</label><select name="type"><option value="main" ${s.type=='main'?'selected':''}>Chính</option><option value="part" ${s.type=='part'?'selected':''}>Phụ</option></select>`,[['Hủy',0],['Lưu',1,'p']]);
if(!x.v)return;if(!x.f.name.trim())return info('Thiếu tên','Vui lòng nhập họ tên.');if(id)Object.assign(s,x.f);else{s.id=Date.now();Object.assign(s,x.f,{left:''});db.staff.push(s)}putStaff(s).catch(fail);renderA2()}
async function quit(id){const x=await dlg('Nghỉ việc',`<label>Ngày nghỉ việc</label><input type="date" name="d" value="${today()}"><p class="mu">Sau ngày này nhân viên sẽ không còn trong check in/out, chỉ còn trong bảng tổng hợp tháng đó.</p>`,[['Hủy',0],['Xác nhận',1,'p']]);if(x.v&&x.f.d){const s=sf(id);s.left=x.f.d;putStaff(s).catch(fail);renderA2()}}
function back(id){const s=sf(id);s.left='';putStaff(s).catch(fail);renderA2()}
async function delS(id){if((await dlg('Xóa nhân viên','Xóa nhân viên (và toàn bộ chấm công của người này)? Nếu chỉ nghỉ việc, hãy dùng nút "Nghỉ việc".',[['Hủy',0],['Xóa',1,'p']])).v){const ids=db.rec.filter(r=>r.sid==id).map(r=>r.id);db.staff=db.staff.filter(s=>s.id!=id);db.rec=db.rec.filter(r=>r.sid!=id);delDocs('records',ids).catch(fail);delDocs('staff',[id]).catch(fail);renderA2()}}
function renderA3(){const s=db.s,i=(k,l,t)=>`<label>${l}</label><${t||'input'} id="s_${k}" ${t?'rows="2">'+esc(s[k])+'</textarea':`value="${esc(s[k])}">`}`;
$('a3').innerHTML=`<div class="card">${i('id','ID admin')}${i('pw','Mật khẩu admin')}${i('title','Tiêu đề')}${i('sub','Phụ đề')}${i('mLate','Thông báo đi trễ','textarea')}${i('mThanks','Thông báo khi check out muộn','textarea')}${i('mOk','Thông báo thành công','textarea')}<label>Logo</label><input type="file" id="s_logo" accept="image/*"><button class="btn" onclick="saveS()">Lưu thay đổi</button></div>`}
function saveS(){const g=k=>$('s_'+k).value;if(!g('id').trim()||!g('pw').trim())return info('Thiếu thông tin','ID và mật khẩu không được trống.');
['id','pw','title','sub','mLate','mThanks','mOk'].forEach(k=>db.s[k]=g(k));const f=$('s_logo').files[0],done=()=>{putSet().catch(fail);skin();info('✔','Đã lưu thay đổi.')};f?img(f,300,d=>{db.s.logo=d;done()}):done()}
function renderAll(){renderA1();renderA2();renderA3()}
function login(){if($('aid').value==db.s.id&&$('apw').value==db.s.pw){sessionStorage.adm=1;showAdm()}else info('Sai thông tin','ID hoặc mật khẩu không đúng.')}
function logout(){delete sessionStorage.adm;showAdm()}
function showAdm(){const on=!!sessionStorage.adm;$('lgn').classList.toggle('hide',on);$('adm').classList.toggle('hide',!on);$('apw').value='';if(on)renderAll()}
function refresh(){fillSel();if(sessionStorage.adm&&!$('adm').classList.contains('hide')){renderA1();renderA2()}}
skin();fillSel();showAdm();
onSnapshot(doc(fs,'settings','main'),d=>{if(d.exists()){db.s={...DEF_S,...d.data()};skin();if(sessionStorage.adm)renderA3()}else putSet().catch(fail)},fail);
onSnapshot(collection(fs,'staff'),q=>{db.staff=q.docs.map(x=>x.data()).sort((a,b)=>a.id-b.id);refresh()},fail);
onSnapshot(collection(fs,'records'),q=>{db.rec=q.docs.map(x=>x.data());refresh()},fail);
Object.assign(window,{$,checkin,checkout,login,logout,xls,appr,big,editR,delR,editS,quit,back,delS,saveS,delData,renderA1});
</script></body></html>
